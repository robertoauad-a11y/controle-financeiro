<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Financeiro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f9;color:#1b2a3b;min-height:100vh;}
  :root{
    --navy:#0f1f35;--blue:#1a3a5c;--blue2:#2c4a6e;
    --green:#0d7a5f;--green2:#065f46;--green3:#d1fae5;
    --amber:#b45309;--amber2:#fef9c3;
    --red:#991b1b;--red2:#fee2e2;
    --orange:#9a3412;--orange2:#ffedd5;
    --slate:#64748b;--border:#e2e8f0;--zebra:#f7fafd;
  }
  /* NAV */
  nav{background:var(--navy);display:flex;align-items:center;padding:0 24px;box-shadow:0 2px 12px rgba(0,0,0,.3);position:sticky;top:0;z-index:100;}
  .brand{padding:16px 0;margin-right:28px;}
  .brand h1{color:#fff;font-size:17px;font-weight:800;}
  .brand p{color:#94a3b8;font-size:11px;margin-top:1px;}
  .nav-btn{background:transparent;border:none;color:#94a3b8;padding:20px 16px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;border-bottom:3px solid transparent;transition:all .15s;}
  .nav-btn.active{color:#fff;font-weight:700;background:#1a3a5c;border-bottom:3px solid var(--green);}
  .nav-right{margin-left:auto;display:flex;gap:8px;}
  /* MAIN */
  main{padding:24px;max-width:1400px;margin:0 auto;}
  /* CARDS */
  .cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 20px;flex:1;min-width:140px;}
  .card-label{font-size:10px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
  .card-value{font-size:20px;font-weight:800;}
  .card-sub{font-size:11px;color:#94a3b8;margin-top:2px;}
  /* TOOLBAR */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  /* TABLE */
  .table-wrap{background:#fff;border-radius:12px;overflow:auto;box-shadow:0 1px 6px rgba(0,0,0,.06);}
  table{width:100%;border-collapse:collapse;}
  th{background:var(--blue);color:#fff;padding:10px 12px;font-size:12px;font-weight:700;text-align:left;white-space:nowrap;border-bottom:2px solid var(--navy);}
  td{padding:9px 12px;font-size:12px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:nth-child(even) td{background:var(--zebra);}
  tr:hover td{background:#eef3fa;}
  tfoot td{background:var(--blue);color:#fff;font-weight:700;font-size:12px;padding:10px 12px;}
  .tr{text-align:right;}
  /* BADGE */
  .badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
  /* BUTTONS */
  .btn{border:none;border-radius:7px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s;}
  .btn:hover{opacity:.85;}
  .btn-sm{padding:4px 10px;font-size:11px;}
  .btn-primary{background:var(--green);color:#fff;}
  .btn-navy{background:var(--blue);color:#fff;}
  .btn-red{background:#dc2626;color:#fff;}
  .btn-amber{background:var(--amber);color:#fff;}
  .btn-purple{background:#6b4c9a;color:#fff;}
  .btn-slate{background:#94a3b8;color:#fff;}
  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(15,31,53,.65);z-index:1000;display:flex;align-items:center;justify-content:center;}
  .modal{background:#fff;border-radius:14px;padding:28px;width:min(96vw,640px);max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .modal-header h2{font-size:16px;color:var(--navy);}
  .modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#94a3b8;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-full{grid-column:1/-1;}
  .form-group label{display:block;font-size:12px;font-weight:600;color:var(--blue);margin-bottom:4px;}
  .form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;outline:none;transition:border .15s;}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--blue2);}
  .modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
  /* SELECT */
  select{background:#fff;}
  /* EMPTY */
  .empty{padding:48px;text-align:center;color:#94a3b8;}
  .empty span{font-size:36px;display:block;margin-bottom:8px;}
  /* TOAST */
  .toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:opacity .3s;}
  .toast.show{opacity:1;}
  /* RESUMO TABLE highlights */
  .pos{color:var(--green2);font-weight:700;}
  .neg{color:var(--red);font-weight:700;}
</style>
</head>
<body>

<nav>
  <div class="brand"><h1>💼 Controle Financeiro</h1><p>Gestão Financeira Pessoal</p></div>
  <button class="nav-btn active" onclick="showTab('custos')">💰 Custos</button>
  <button class="nav-btn" onclick="showTab('receitas')">💚 Receitas</button>

</nav>

// ══════════════════════════════════════════════════════
// ESTADO & PERSISTÊNCIA
// ══════════════════════════════════════════════════════
let DB = {custos:[], receitas:[], demandas:[]};
let currentTab = 'custos';
let editingId = null;
let editingType = null;
let filterMes = 'todos';

function loadDB() {
  try {
    const saved = localStorage.getItem('cf_data');
    if (saved) { DB = JSON.parse(saved); }
    else { DB = JSON.parse(JSON.stringify(DADOS_DEFAULT)); saveDB(); }
  } catch(e) { DB = JSON.parse(JSON.stringify(DADOS_DEFAULT)); }
}

function saveDB() {
  localStorage.setItem('cf_data', JSON.stringify(DB));
}

// ══════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════
const R = v => `R$ ${(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const fmtDate = s => { if(!s) return '—'; const d=new Date(s+'T00:00:00'); return isNaN(d)?s:`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; };
const mesLabel = s => { if(!s) return ''; const [y,m]=s.split('-'); const d=new Date(y,m-1,1); return d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); };
const nextId = arr => arr.length ? Math.max(...arr.map(x=>x.id))+1 : 1;

function badge(val) {
  const v = (val||'').toLowerCase();
  let bg='#f1f5f9',color='#64748b';
  if(v.includes('pago')||v.includes('recebido')||v.includes('concluíd')||v.includes('concluida')||v==='sim'){bg='#d1fae5';color='#065f46';}
  else if(v.includes('pend')){bg='#fef9c3';color='#854d0e';}
  else if(v.includes('parcial')||v.includes('andamento')){bg='#ffedd5';color='#9a3412';}
  else if(v.includes('atras')||v==='não'){bg='#fee2e2';color='#991b1b';}
  else if(v==='baixa'){bg='#dbeafe';color='#1e40af';}
  else if(v==='média'){bg='#fef3c7';color='#92400e';}
  else if(v==='alta'){bg='#fee2e2';color='#991b1b';}
  return `<span class="badge" style="background:${bg};color:${color}">${val||'—'}</span>`;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// ══════════════════════════════════════════════════════
// NAVEGAÇÃO
// ══════════════════════════════════════════════════════
function showTab(tab) {
  currentTab = tab;
  ['custos','receitas','resumo','demandas'].forEach(t => {
    document.getElementById('tab-'+t).style.display = t===tab ? '' : 'none';
  });
  document.querySelectorAll('.nav-btn').forEach((b,i) => {
    b.classList.toggle('active', ['custos','receitas','resumo','demandas'][i]===tab);
  });
  render();
}

// ══════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════
function render() {
  if(currentTab==='custos') renderCustos();
  else if(currentTab==='receitas') renderReceitas();
  else if(currentTab==='resumo') renderResumo();
  else renderDemandas();
}

function renderCustos() {
  const meses = ['todos', ...[...new Set(DB.custos.map(c=>c.mes).filter(Boolean))].sort()];
  const cf = filterMes==='todos' ? DB.custos : DB.custos.filter(c=>c.mes===filterMes);
  const tPrev = cf.reduce((a,c)=>a+(c.previsto||0),0);
  const tPago = cf.reduce((a,c)=>a+(c.pago||0),0);
  const diff = tPago - tPrev;

  const mesOpts = meses.map(m=>`<option value="${m}" ${m===filterMes?'selected':''}>${m==='todos'?'Todos os meses':mesLabel(m)}</option>`).join('');

  const rows = cf.length ? cf.map((c,i) => {
    const d = (c.pago||0)-(c.previsto||0);
    const dc = d<0?'neg':d>0?'pos':'';
    return `<tr>
      <td style="color:var(--slate);font-size:11px">${mesLabel(c.mes)}</td>
      <td style="font-weight:600">${c.descricao}</td>
      <td>${fmtDate(c.vencimento)}</td>
      <td>${fmtDate(c.dataPag)||'—'}</td>
      <td class="tr">${R(c.previsto)}</td>
      <td class="tr">${R(c.pago)}</td>
      <td class="tr ${dc}">${d===0?'—':R(d)}</td>
      <td style="font-size:11px;color:var(--slate)">${c.fonte||'—'}</td>
      <td>${badge(c.status)}</td>
      <td style="font-size:11px;color:#94a3b8;max-width:160px">${c.obs||'—'}</td>
      <td><div style="display:flex;gap:4px">
        <button class="btn btn-navy btn-sm" onclick="editItem('custo',${c.id})">✏️</button>
        <button class="btn btn-red btn-sm" onclick="delItem('custo',${c.id})">🗑</button>
      </div></td>
    </tr>`;
  }).join('') : `<tr><td colspan="11" class="empty"><span>💰</span>Nenhum registro encontrado</td></tr>`;

  document.getElementById('tab-custos').innerHTML = `
    <div class="cards">
      <div class="card"><div class="card-label">Total Previsto</div><div class="card-value" style="color:var(--blue)">${R(tPrev)}</div></div>
      <div class="card"><div class="card-label">Total Pago</div><div class="card-value" style="color:var(--green)">${R(tPago)}</div></div>
      <div class="card"><div class="card-label">Diferença</div><div class="card-value" style="color:${diff<0?'var(--red)':'var(--green2)'}">${R(diff)}</div><div class="card-sub">Pago − Previsto</div></div>
      <div class="card"><div class="card-label">Pagos</div><div class="card-value" style="color:var(--green2)">${cf.filter(c=>c.status==='Pago').length}</div><div class="card-sub">registros</div></div>
      <div class="card"><div class="card-label">Pendentes</div><div class="card-value" style="color:var(--red)">${cf.filter(c=>c.status!=='Pago').length}</div><div class="card-sub">registros</div></div>
    </div>
    <div class="toolbar">
      <select class="btn btn-slate" onchange="filterMes=this.value;render()" style="font-weight:600">${mesOpts}</select>
      <button class="btn btn-primary" onclick="newItem('custo')">+ Novo Custo</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Mês</th><th>Descrição</th><th>Vencimento</th><th>Data Pag.</th>
          <th class="tr">Previsto</th><th class="tr">Pago</th><th class="tr">Diferença</th>
          <th>Fonte</th><th>Status</th><th>Obs.</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr>
          <td colspan="4">TOTAL</td>
          <td class="tr">${R(tPrev)}</td>
          <td class="tr">${R(tPago)}</td>
          <td class="tr" style="background:${diff<0?'#7f1d1d':'#064e3b'}">${R(diff)}</td>
          <td colspan="4"></td>
        </tr></tfoot>
      </table>
    </div>`;
}

function renderReceitas() {
  const tPrev = DB.receitas.reduce((a,r)=>a+(r.previsto||0),0);
  const tRec  = DB.receitas.reduce((a,r)=>a+(r.recebido||0),0);
  const diff  = tRec - tPrev;

  const rows = DB.receitas.length ? DB.receitas.map(r => {
    const d = (r.recebido||0)-(r.previsto||0);
    const dc = d<0?'neg':d>0?'pos':'';
    return `<tr>
      <td>${fmtDate(r.data)}</td>
      <td style="font-weight:600">${r.descricao}</td>
      <td class="tr">${R(r.previsto)}</td>
      <td class="tr">${R(r.recebido)}</td>

      <td style="font-size:11px;color:var(--slate)">${r.conta||'—'}</td>

      </div></td>
    </tr>`;
  }).join('') : `<tr><td colspan="10" class="empty"><span>💚</span>Nenhuma receita cadastrada</td></tr>`;

  document.getElementById('tab-receitas').innerHTML = `
    <div class="cards">
      <div class="card"><div class="card-label">Total Previsto</div><div class="card-value" style="color:var(--blue)">${R(tPrev)}</div></div>
      <div class="card"><div class="card-label">Total Recebido</div><div class="card-value" style="color:var(--green)">${R(tRec)}</div></div>
      <div class="card"><div class="card-label">Diferença</div><div class="card-value" style="color:${diff<0?'var(--red)':'var(--green2)'}">${R(diff)}</div><div class="card-sub">Recebido − Previsto</div></div>
      <div class="card"><div class="card-label">Recebidos</div><div class="card-value" style="color:var(--green2)">${DB.receitas.filter(r=>r.status==='Recebido').length}</div><div class="card-sub">registros</div></div>
      <div class="card"><div class="card-label">Pendentes/Parciais</div><div class="card-value" style="color:var(--amber)">${DB.receitas.filter(r=>r.status!=='Recebido').length}</div><div class="card-sub">registros</div></div>
    </div>
    <div class="toolbar">
      <button class="btn btn-primary" onclick="newItem('receita')">+ Nova Receita</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Data Rec.</th><th>Descrição</th>
          <th class="tr">Previsto</th><th class="tr">Recebido</th><th class="tr">Diferença</th>
          <th>Categoria</th><th>Conta</th><th>Status</th><th>Obs.</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr>
          <td colspan="2" style="background:var(--green)">TOTAL</td>
          <td class="tr" style="background:var(--green)">${R(tPrev)}</td>
          <td class="tr" style="background:var(--green)">${R(tRec)}</td>
          <td class="tr" style="background:${diff<0?'#7f1d1d':'#064e3b'}">${R(diff)}</td>
          <td colspan="5" style="background:var(--green)"></td>
        </tr></tfoot>
      </table>
    </div>`;
}

function renderResumo() {
  const meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const ano = 2026;
  const totais = {cPrev:0,cPago:0,rPrev:0,rRec:0};

  const rows = meses.map((nome,i) => {
    const m = String(i+1).padStart(2,'0');
    const pref = `${ano}-${m}`;
    const cM = DB.custos.filter(c=>c.mes===pref);
    const rM = DB.receitas.filter(r=>r.data&&r.data.startsWith(pref));
    const cPrev=cM.reduce((a,c)=>a+(c.previsto||0),0);
    const cPago=cM.reduce((a,c)=>a+(c.pago||0),0);
    const rPrev=rM.reduce((a,r)=>a+(r.previsto||0),0);
    const rRec =rM.reduce((a,r)=>a+(r.recebido||0),0);
    const sC=cPago-cPrev, sR=rRec-rPrev, liq=rRec-cPago;
    totais.cPrev+=cPrev;totais.cPago+=cPago;totais.rPrev+=rPrev;totais.rRec+=rRec;
    const N=(v,s)=>s?`<td class="tr ${v<0?'neg':v>0?'pos':''}">${v===0?'—':R(v)}</td>`:`<td class="tr">${v===0?'—':R(v)}</td>`;
    const z=i%2===1?'background:var(--zebra)':'';
    return `<tr style="${z}">
      <td style="font-weight:600">${nome}</td>
      ${N(cPrev,false)}${N(cPago,false)}${N(sC,true)}
      ${N(rPrev,false)}${N(rRec,false)}${N(sR,true)}${N(liq,true)}
    </tr>`;
  }).join('');

  const tLiq=totais.rRec-totais.cPago;
  const tSC=totais.cPago-totais.cPrev, tSR=totais.rRec-totais.rPrev;

  document.getElementById('tab-resumo').innerHTML = `
    <div class="cards">
      <div class="card"><div class="card-label">Custos Pagos ${ano}</div><div class="card-value" style="color:var(--blue)">${R(totais.cPago)}</div></div>
      <div class="card"><div class="card-label">Receitas Recebidas ${ano}</div><div class="card-value" style="color:var(--green)">${R(totais.rRec)}</div></div>
      <div class="card"><div class="card-label">Resultado Líquido</div><div class="card-value" style="color:${tLiq>=0?'var(--green2)':'var(--red)'}">${R(tLiq)}</div><div class="card-sub">Receitas − Custos</div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Mês</th>
          <th class="tr">Custo Previsto</th><th class="tr">Custo Pago</th><th class="tr">Saldo Custos</th>
          <th class="tr">Receita Prev.</th><th class="tr">Receita Rec.</th><th class="tr">Saldo Receitas</th>
          <th class="tr">Resultado Líquido</th>
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr>
          <td>TOTAL ${ano}</td>
          <td class="tr">${R(totais.cPrev)}</td>
          <td class="tr">${R(totais.cPago)}</td>
          <td class="tr" style="background:${tSC<0?'#7f1d1d':'#064e3b'}">${R(tSC)}</td>
          <td class="tr">${R(totais.rPrev)}</td>
          <td class="tr">${R(totais.rRec)}</td>
          <td class="tr" style="background:${tSR<0?'#7f1d1d':'#064e3b'}">${R(tSR)}</td>
          <td class="tr" style="background:${tLiq<0?'#7f1d1d':'#064e3b'}">${R(tLiq)}</td>
        </tr></tfoot>
      </table>
    </div>`;
}

function renderDemandas() {
  const rows = DB.demandas.length ? DB.demandas.map(d => `<tr>
    <td style="font-weight:700;max-width:240px">${d.tarefa}</td>
    <td style="font-size:11px;color:var(--slate)">${d.contato||'—'}</td>
    <td style="font-size:11px;color:var(--slate);max-width:180px">${d.detalhes||'—'}</td>
    <td>${fmtDate(d.prazo)}</td>
    <td>${badge(d.prioridade)}</td>
    <td>${badge(d.status)}</td>
    <td>${badge(d.concluida)}</td>
    <td style="font-size:11px;color:#94a3b8">${d.obs||'—'}</td>
    <td><div style="display:flex;gap:4px">
      <button class="btn btn-purple btn-sm" onclick="editItem('demanda',${d.id})">✏️</button>
      <button class="btn btn-red btn-sm" onclick="delItem('demanda',${d.id})">🗑</button>
    </div></td>
  </tr>`).join('') : `<tr><td colspan="9" class="empty"><span>📋</span>Nenhuma demanda cadastrada</td></tr>`;

  document.getElementById('tab-demandas').innerHTML = `
    <div class="cards">
      <div class="card"><div class="card-label">Total</div><div class="card-value" style="color:#6b4c9a">${DB.demandas.length}</div><div class="card-sub">tarefas</div></div>
      <div class="card"><div class="card-label">Pendentes</div><div class="card-value" style="color:var(--amber)">${DB.demandas.filter(d=>d.status==='Pendente').length}</div><div class="card-sub">tarefas</div></div>
      <div class="card"><div class="card-label">Em Andamento</div><div class="card-value" style="color:var(--orange)">${DB.demandas.filter(d=>d.status==='Em Andamento').length}</div><div class="card-sub">tarefas</div></div>
      <div class="card"><div class="card-label">Concluídas</div><div class="card-value" style="color:var(--green2)">${DB.demandas.filter(d=>d.status==='Concluída').length}</div><div class="card-sub">tarefas</div></div>
    </div>
    <div class="toolbar">
      <button class="btn btn-purple" onclick="newItem('demanda')">+ Nova Demanda</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Tarefa</th><th>Contato</th><th>Detalhes</th><th>Prazo</th><th>Prioridade</th><th>Status</th><th>Concluída?</th><th>Obs.</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// ══════════════════════════════════════════════════════
// FORMULÁRIOS
// ══════════════════════════════════════════════════════
const SEL = (id,opts,val) => `<select id="${id}">${opts.map(o=>`<option value="${o}" ${o===val?'selected':''}>${o}</option>`).join('')}</select>`;
const INP = (id,type,val,ph='') => `<input id="${id}" type="${type}" value="${val||''}" placeholder="${ph}">`;
const FG = (label,full,html) => `<div class="form-group ${full?'form-full':''}">${label?`<label>${label}</label>`:''} ${html}</div>`;

const FONTES = ['BB','Conta Corrente','Conta Salário','Dinheiro','Débito Automático','Transferência','PIX','Cartão de Crédito'];
const CAT_REC = ['Aluguel','Salário','Freelance','Investimento','Pensão','Outros'];

function formCusto(c={}) {
  return `<div class="form-grid">
    ${FG('Mês de Referência',false,INP('f-mes','month',c.mes||''))}
    ${FG('Status',false,SEL('f-status',['Pago','Pendente','Parcial','Atrasado'],c.status||'Pendente'))}
    ${FG('Descrição / Categoria',true,INP('f-desc','text',c.descricao,'Ex: Luz, Aluguel...'))}
    ${FG('Vencimento',false,INP('f-venc','date',c.vencimento))}
    ${FG('Data de Pagamento',false,INP('f-datapag','date',c.dataPag))}
    ${FG('Valor Previsto (R$)',false,INP('f-prev','number',c.previsto,'0,00'))}
    ${FG('Valor Pago (R$)',false,INP('f-pago','number',c.pago,'0,00'))}
    ${FG('Fonte do Pagamento',false,SEL('f-fonte',['','...'].concat(FONTES),c.fonte||''))}
    ${FG('Observações',true,INP('f-obs','text',c.obs,'Opcional'))}
  </div>`;
}

function formReceita(r={}) {
  return `<div class="form-grid">
    ${FG('Data de Recebimento',false,INP('f-data','date',r.data))}
    ${FG('Status',false,SEL('f-status',['Recebido','Pendente','Parcial'],r.status||'Pendente'))}
    ${FG('Descrição / Origem',true,INP('f-desc','text',r.descricao,'Ex: Aluguel, Salário...'))}
    ${FG('Valor Previsto (R$)',false,INP('f-prev','number',r.previsto,'0,00'))}
    ${FG('Valor Recebido (R$)',false,INP('f-rec','number',r.recebido,'0,00'))}
    ${FG('Categoria',false,SEL('f-cat',CAT_REC,r.categoria||'Aluguel'))}
    ${FG('Conta de Destino',false,SEL('f-conta',['','...'].concat(FONTES),r.conta||''))}
    ${FG('Observações',true,INP('f-obs','text',r.obs,'Opcional'))}
  </div>`;
}

function formDemanda(d={}) {
  return `<div class="form-grid">
    ${FG('Tarefa / Demanda',true,INP('f-tarefa','text',d.tarefa,'Nome da tarefa...'))}
    ${FG('Prioridade',false,SEL('f-prior',['Alta','Média','Baixa'],d.prioridade||'Alta'))}
    ${FG('Status',false,SEL('f-status',['Pendente','Em Andamento','Concluída','Atrasada'],d.status||'Pendente'))}
    ${FG('Prazo',false,INP('f-prazo','date',d.prazo))}
    ${FG('Concluída?',false,SEL('f-conc',['Não','Sim'],d.concluida||'Não'))}
    ${FG('Contato',false,INP('f-contato','text',d.contato,'Nome / Telefone...'))}
    ${FG('Detalhes',true,INP('f-det','text',d.detalhes,'Informações adicionais...'))}
    ${FG('Observações',true,INP('f-obs','text',d.obs,'Opcional'))}
  </div>`;
}

function newItem(type) {
  editingId = null; editingType = type;
  document.getElementById('modal-title').textContent = type==='custo'?'Novo Custo':type==='receita'?'Nova Receita':'Nova Demanda';
  document.getElementById('modal-body').innerHTML = type==='custo'?formCusto():type==='receita'?formReceita():formDemanda();
  document.getElementById('modal').style.display = 'flex';
}

function editItem(type, id) {
  editingId = id; editingType = type;
  const arr = type==='custo'?DB.custos:type==='receita'?DB.receitas:DB.demandas;
  const item = arr.find(x=>x.id===id);
  document.getElementById('modal-title').textContent = type==='custo'?'Editar Custo':type==='receita'?'Editar Receita':'Editar Demanda';
  document.getElementById('modal-body').innerHTML = type==='custo'?formCusto(item):type==='receita'?formReceita(item):formDemanda(item);
  document.getElementById('modal').style.display = 'flex';
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }

function g(id) { const el=document.getElementById(id); return el?el.value.trim():''; }

function saveForm() {
  if (editingType==='custo') {
    const obj = {
      mes: g('f-mes'), descricao: g('f-desc'), vencimento: g('f-venc'),
      dataPag: g('f-datapag'), previsto: parseFloat(g('f-prev'))||0,
      pago: parseFloat(g('f-pago'))||0, fonte: g('f-fonte'),
      status: g('f-status'), obs: g('f-obs')
    };
    if (!obj.descricao) { alert('Preencha a descrição.'); return; }
    if (editingId) DB.custos = DB.custos.map(c=>c.id===editingId?{...obj,id:editingId}:c);
    else DB.custos.push({...obj, id: nextId(DB.custos)});
  } else if (editingType==='receita') {
    const obj = {
      data: g('f-data'), descricao: g('f-desc'),
      previsto: parseFloat(g('f-prev'))||0, recebido: parseFloat(g('f-rec'))||0,
      categoria: g('f-cat'), conta: g('f-conta'),
      status: g('f-status'), obs: g('f-obs')
    };
    if (!obj.descricao) { alert('Preencha a descrição.'); return; }
    if (editingId) DB.receitas = DB.receitas.map(r=>r.id===editingId?{...obj,id:editingId}:r);
    else DB.receitas.push({...obj, id: nextId(DB.receitas)});
  } else {
    const obj = {
      tarefa: g('f-tarefa'), contato: g('f-contato'), detalhes: g('f-det'),
      prazo: g('f-prazo'), prioridade: g('f-prior'),
      status: g('f-status'), concluida: g('f-conc'), obs: g('f-obs')
    };
    if (!obj.tarefa) { alert('Preencha a tarefa.'); return; }
    if (editingId) DB.demandas = DB.demandas.map(d=>d.id===editingId?{...obj,id:editingId}:d);
    else DB.demandas.push({...obj, id: nextId(DB.demandas)});
  }
  saveDB(); closeModal(); render(); toast('✅ Salvo com sucesso!');
}

function delItem(type, id) {
  if (!confirm('Excluir este registro?')) return;
  if (type==='custo') DB.custos = DB.custos.filter(c=>c.id!==id);
  else if (type==='receita') DB.receitas = DB.receitas.filter(r=>r.id!==id);
  else DB.demandas = DB.demandas.filter(d=>d.id!==id);
  saveDB(); render(); toast('🗑 Excluído.');
}

// ══════════════════════════════════════════════════════
// EXPORTAR EXCEL
// ══════════════════════════════════════════════════════
function exportExcel() {
  const wb = XLSX.utils.book_new();

  // Custos
  const cRows = [['Mês','Descrição','Vencimento','Data Pagamento','Valor Previsto','Valor Pago','Diferença','Fonte','Status','Observações']];
  DB.custos.forEach(c => cRows.push([mesLabel(c.mes),c.descricao,c.vencimento,c.dataPag,c.previsto,c.pago,(c.pago||0)-(c.previsto||0),c.fonte,c.status,c.obs]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(cRows), 'Custos');

  // Receitas
  const rRows = [['Data','Descrição','Previsto','Recebido','Diferença','Categoria','Conta','Status','Observações']];
  DB.receitas.forEach(r => rRows.push([r.data,r.descricao,r.previsto,r.recebido,(r.recebido||0)-(r.previsto||0),r.categoria,r.conta,r.status,r.obs]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rRows), 'Receitas');

  // Demandas
  const dRows = [['Tarefa','Contato','Detalhes','Prazo','Prioridade','Status','Concluída?','Observações']];
  DB.demandas.forEach(d => dRows.push([d.tarefa,d.contato,d.detalhes,d.prazo,d.prioridade,d.status,d.concluida,d.obs]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dRows), 'Demandas');

  XLSX.writeFile(wb, `Controle_Financeiro_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('📊 Excel exportado!');
}

// ══════════════════════════════════════════════════════
// BACKUP JSON
// ══════════════════════════════════════════════════════
function exportBackup() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `CF_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click(); toast('💾 Backup salvo!');
}

function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.custos && data.receitas && data.demandas) {
        DB = data; saveDB(); render(); toast('📂 Dados importados!');
      } else alert('Arquivo inválido.');
    } catch { alert('Erro ao importar.'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ══════════════════════════════════════════════════════
loadDB();
render();
</script>
